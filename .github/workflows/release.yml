name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: mode

  version:
    name: Open release PR
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Changesets commits release version and changelog updates.
      pull-requests: write # Changesets opens and updates the Release PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          script: bun run changeset:version-check
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          pr-base-branch: main

  pack:
    name: Pack and verify release artifact
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYLOAD_REDIRECT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
      source-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - name: Check release identity before packing
        env:
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.private === true) throw new Error("Remove private: true only after finalizing the package identity.");
          if (!pkg.name || pkg.name.endsWith("/package-name")) throw new Error("Set the final npm package name.");
          if (pkg.repository?.url !== `git+${process.env.EXPECTED_REPOSITORY}`) throw new Error("package.json repository.url must match this GitHub repository.");
          if (pkg.publishConfig?.access !== "public" || pkg.publishConfig?.registry !== "https://registry.npmjs.org/") throw new Error("Publishing must target the public npm registry.");
          NODE

      - run: bun run check
      - run: bun run test:int
      - run: bun audit --audit-level=high

      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.prepare.outputs.publish-plan-artifact-id }}

      # The artifact list can lag behind the upload; the first download can report
      # "None of the provided artifact IDs were found" for a freshly uploaded artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-pack
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/changesets-pack

      - name: Wait before retrying the pack artifact download
        if: steps.download-pack.outcome == 'failure'
        run: sleep 20

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.download-pack.outcome == 'failure'
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/changesets-pack

      - name: Verify the exact packed release artifact
        env:
          PACK_DIR: ${{ runner.temp }}/changesets-pack
          CONSUMER_DIR: ${{ runner.temp }}/payload-redirect-release-consumer
        run: |
          node scripts/verify-tarball.mjs --pack-dir "$PACK_DIR"

  publish:
    name: Publish package and create GitHub Release
    needs: [prepare, pack]
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write # Changesets creates the published version tag.
      id-token: write # npm exchanges this job's OIDC identity for short-lived publishing access.
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify artifact belongs to this source commit
        env:
          PACK_SOURCE_SHA: ${{ needs.pack.outputs.source-sha }}
        run: test "$PACK_SOURCE_SHA" = "$GITHUB_SHA"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: publish
        with:
          github-token: ${{ github.token }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false
          push-git-tags: true

      - name: Verify release tag and create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          TAG="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (published.length !== 1) throw new Error(`Expected one published package, found ${published.length}.`);
          if (published[0].name !== pkg.name || published[0].version !== pkg.version) throw new Error("Published package does not match package.json.");
          process.stdout.write(`v${pkg.version}`);
          NODE
          )"
          TAG_SHA="$(TAG="$TAG" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const base = `repos/${process.env.GITHUB_REPOSITORY}/git`;
          const ref = JSON.parse(execFileSync("gh", ["api", `${base}/ref/tags/${process.env.TAG}`], { encoding: "utf8" }));
          const object = ref.object.type === "tag"
            ? JSON.parse(execFileSync("gh", ["api", `${base}/tags/${ref.object.sha}`], { encoding: "utf8" })).object
            : ref.object;
          process.stdout.write(object.sha);
          NODE
          )"
          if [ "$TAG_SHA" != "$RELEASE_SOURCE_SHA" ]; then
            echo "Release tag $TAG points to ${TAG_SHA:-no commit}, expected $RELEASE_SOURCE_SHA." >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --generate-notes

  verify-release:
    needs: [pack, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      # npm can take several minutes to serve a new version and its provenance attestations; the checks below
      # fail on a 404 before that.
      - name: Wait for npm to serve the published version
        run: |
          spec="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          for _ in $(seq 1 60); do
            if npm view "$spec" version >/dev/null 2>&1; then
              url="$(npm view "$spec" dist.attestations.url 2>/dev/null)"
              if [ -n "$url" ] && curl -fsS -o /dev/null "$url"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "npm did not serve ${spec} and its attestations within 10 minutes." >&2
          exit 1

      - name: Verify npm publication, provenance, Git tag, release, and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ needs.pack.outputs.source-sha }}
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdtempSync, readFileSync } from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (published.length !== 1 || published[0].name !== pkg.name || published[0].version !== pkg.version) {
            throw new Error("Published package does not match package.json.");
          }
          const spec = `${pkg.name}@${pkg.version}`;
          const integrity = JSON.parse(execFileSync("npm", ["view", spec, "dist.integrity", "--json"], { encoding: "utf8" }));
          if (!integrity) throw new Error(`npm has no integrity for ${spec}.`);
          const attestations = JSON.parse(execFileSync("npm", ["view", spec, "dist.attestations", "--json"], { encoding: "utf8" }));
          if (!attestations) throw new Error(`npm has no provenance attestations for ${spec}.`);
          // npm 12 wraps `view <pkg> dist-tags` output in an array; npm 11 returns the object.
          const distTagsOutput = JSON.parse(execFileSync("npm", ["view", pkg.name, "dist-tags", "--json"], { encoding: "utf8" }));
          const distTags = Array.isArray(distTagsOutput) ? distTagsOutput[0] : distTagsOutput;
          if (distTags.latest !== pkg.version) throw new Error(`The latest dist-tag points to ${distTags.latest}, not ${pkg.version}.`);
          const verifyDir = mkdtempSync(path.join(os.tmpdir(), "npm-release-verify-"));
          execFileSync("npm", ["install", "--prefix", verifyDir, "--ignore-scripts", "--no-audit", "--no-fund", spec], { stdio: "inherit" });
          execFileSync("npm", ["audit", "signatures", "--prefix", verifyDir], { stdio: "inherit" });
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          if (!changelog.includes(`## ${pkg.version}`)) throw new Error(`CHANGELOG.md has no entry for ${pkg.version}.`);
          const tag = `v${pkg.version}`;
          const ref = JSON.parse(execFileSync("gh", ["api", `repos/${process.env.EXPECTED_REPOSITORY}/git/ref/tags/${tag}`], { encoding: "utf8" }));
          const object = ref.object.type === "tag"
            ? JSON.parse(execFileSync("gh", ["api", `repos/${process.env.EXPECTED_REPOSITORY}/git/tags/${ref.object.sha}`], { encoding: "utf8" })).object
            : ref.object;
          if (object.sha !== process.env.RELEASE_SOURCE_SHA) throw new Error(`${tag} does not point to the published source commit.`);
          const release = JSON.parse(execFileSync("gh", ["release", "view", tag, "--json", "tagName,isDraft,isPrerelease"], { encoding: "utf8" }));
          if (release.tagName !== tag || release.isDraft || release.isPrerelease) throw new Error(`GitHub Release ${tag} is missing or incomplete.`);
          console.log(`Verified npm ${spec}, latest dist-tag, provenance, ${tag}, GitHub Release, and changelog.`);
          NODE

  outcome:
    needs: [prepare, version, pack, publish, verify-release]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Verify release outcome
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          VERSION_RESULT: ${{ needs.version.result }}
          PACK_RESULT: ${{ needs.pack.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          VERIFY_RESULT: ${{ needs.verify-release.result }}
        run: bun run scripts/release-outcome.ts
