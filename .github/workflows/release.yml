name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYLOAD_REDIRECT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Check tag and branch
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match package version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag commit is not on main"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:oxlint
      - run: bun run check:boundaries
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:int
      - run: bun run build
      - run: bun run check:release
      - run: bun audit --audit-level=high
      - name: Pack the release tarball
        id: pack
        run: |
          mkdir -p release
          npm pack --silent --pack-destination release
          cd release
          echo "sha256=$(sha256sum ./*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Publish the validated tarball with provenance
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          tarball="klnap-payload-redirect-$VERSION.tgz"
          echo "$EXPECTED_SHA256  $tarball" | sha256sum --check
          if npm view "@klnap/payload-redirect@$VERSION" version >/dev/null 2>&1; then
            echo "@klnap/payload-redirect@$VERSION is already on npm; skipping publish."
          else
            npm publish "./$tarball" --provenance --access public
          fi

  stage:
    needs: validate
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Stage the validated package on npm
        run: npm stage publish
